name: 编译与测试

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布标签（留空则只测试，例如 v0.1.1）
        required: false
        type: string
  push:
    branches: [main, refactor-rs]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aipocket
          POSTGRES_PASSWORD: aipocket
          POSTGRES_DB: aipocket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aipocket -d aipocket"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://aipocket:aipocket@localhost:5432/aipocket
      DEDUP_REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql://aipocket:aipocket@localhost:5432/aipocket
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p aipocket-db --tests -- --ignored
      - name: 编译后端发布版
        run: |
          cargo build --release --locked -p aipocket
          tar -czf aipocket-linux-x86_64.tar.gz -C target/release aipocket
      - name: 上传后端编译产物
        uses: actions/upload-artifact@v4
        with:
          name: aipocket-linux-x86_64
          path: aipocket-linux-x86_64.tar.gz
          if-no-files-found: error
      - uses: taiki-e/install-action@cargo-llvm-cov
      # scanner.rs is intentionally covered (not ignored). Keep only binary assembly /
      # large generated route tables out of the denominator.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info --ignore-filename-regex 'crates/aipocket/src/(main|maintenance)\.rs|crates/aipocket-api/src/routes\.rs' -- --include-ignored
      - name: Enforce >85% line coverage
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 86 --ignore-filename-regex 'crates/aipocket/src/(main|maintenance)\.rs|crates/aipocket-api/src/routes\.rs' -- --include-ignored
      - uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: lcov.info

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test -- --run
      - run: pnpm build
      - name: 上传前端编译产物
        uses: actions/upload-artifact@v4
        with:
          name: aipocket-frontend
          path: frontend/dist
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aipocket-linux-x86_64
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: aipocket-frontend
          path: package/aipocket/web
      - name: 打包原生运行版
        run: |
          tar -xzf package/aipocket-linux-x86_64.tar.gz -C package/aipocket
          cp .env.example README.md LICENSE package/aipocket/
          package/aipocket/aipocket --help >/dev/null
          test -f package/aipocket/web/index.html
          grep -qx 'WEB_STATIC_DIR=web' package/aipocket/.env.example
          tar -czf aipocket-native-linux-x86_64.tar.gz -C package aipocket
      - name: 上传原生运行包
        uses: actions/upload-artifact@v4
        with:
          name: aipocket-native-linux-x86_64
          path: aipocket-native-linux-x86_64.tar.gz
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aipocket-backend .
      - run: docker build -t aipocket-frontend frontend

  release:
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    needs: [package, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aipocket-native-linux-x86_64
          path: release
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "无效的发布标签: $RELEASE_TAG" >&2
            exit 1
          fi
          notes="Linux x86_64 原生运行包，无需 Docker。解压后复制 .env.example 为 .env，配置 WEB_PASSWORD、WEB_JWT_SECRET、WEB_HOST 和 WEB_PORT，再运行 ./aipocket serve；--host/--port 可临时覆盖。"
          if target=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "标签 $RELEASE_TAG 已指向其他提交: $target" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "AIPocket $RELEASE_TAG" --notes "$notes"
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber release/aipocket-native-linux-x86_64.tar.gz
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "AIPocket $RELEASE_TAG" \
              --notes "$notes" \
              release/aipocket-native-linux-x86_64.tar.gz
          fi
